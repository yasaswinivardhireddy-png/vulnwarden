# Expected correlation of the sample third-party reports in examples/vulnerable-shop/reports.
correlation:
  cross_scanner_duplicates: 3  # Semgrep SQL injection + TLS verification, Trivy PyYAML
  stale: 4                     # Semgrep: deleted file, removed code; Trivy: already-upgraded requests, undeclared Django
