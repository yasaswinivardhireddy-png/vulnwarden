[project]
name = "vulnwarden"
version = "0.1.0"
description = "Agentic vulnerability and cryptography remediation: scan, triage, fix, validate, open GitHub pull requests and follow up until closure."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vardhireddy Yasaswini" }]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=43",
    "cvss>=3.2",
    "packaging>=24",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=3.0"]

[project.scripts]
vulnwarden = "vulnwarden.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "cyclonedx-python-lib[json-validation]>=8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnwarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "S404", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S105", "S106", "S108", "S110", "S113", "S301", "S307", "S311", "S324", "S501", "S506", "B017"]
